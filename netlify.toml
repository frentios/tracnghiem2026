[build]
  publish = "."
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.arbeitnow.com https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/teacher-login.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[functions]
  node_bundler = "esbuild"
  included_files = ["career-engine.js"]
[[redirects]]
  from = "/api/careers"
  to = "/.netlify/functions/careers"
  status = 200

[[redirects]]
  from = "/api/recommend"
  to = "/.netlify/functions/recommend"
  status = 200
